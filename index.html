        {
          "@type": "Question",
          "name": "O que é o modelo CTO as a Service da Nexus?",
          "acceptedAnswer": { "@type": "Answer", "text": "Assumimos integralmente o departamento de tecnologia da sua empresa. Você passa a contar com um time de engenharia sênior — arquitetos, devs, especialistas em RPA, IA e IoT — sem precisar contratar, treinar ou manter estrutura interna. Atuamos como seu CTO e seu time, em um único contrato." }
        },
        {
          "@type": "Question",
          "name": "Como funciona a contratação? É por projeto ou mensal?",
          "acceptedAnswer": { "@type": "Answer", "text": "Trabalhamos no modelo de parceria mensal recorrente, com escopo dimensionado para a sua operação. Não vendemos projetos pontuais — vendemos sustentação e melhoria contínua. Após o diagnóstico inicial gratuito, definimos juntos o pacote ideal de horas e squad dedicado." }
        },
        {
          "@type": "Question",
          "name": "Qual o SLA de atendimento e resposta?",
          "acceptedAnswer": { "@type": "Answer", "text": "Incidentes críticos: resposta em até 1h, 24/7. Demandas de alta prioridade: até 4h em horário comercial. Evolução e novas automações: planejadas em sprints quinzenais. Todos os SLAs são formalizados em contrato e monitorados em dashboard transparente." }
        },
        {
          "@type": "Question",
          "name": "Em quanto tempo vejo os primeiros resultados?",
          "acceptedAnswer": { "@type": "Answer", "text": "Diagnóstico completo em 7 a 14 dias. Primeira automação em produção em 30 dias. Ganhos mensuráveis (horas economizadas, redução de erros, ROI) tipicamente a partir do segundo mês. Cada sprint entrega valor incremental — você não espera 6 meses para ver retorno." }
        },
        {
          "@type": "Question",
          "name": "Quais tecnologias vocês dominam?",
          "acceptedAnswer": { "@type": "Answer", "text": "RPA (n8n, Make, UiPath, automações custom em Python/Node), IA (OpenAI, Anthropic, modelos open-source, agentes autônomos, RAG), IoT (Raspberry Pi, ESP32, sensores industriais), Cloud (AWS, GCP, Supabase) e integrações com qualquer ERP, CRM ou sistema legado." }
        },
        {
          "@type": "Question",
          "name": "Vocês fazem coleta e análise de dados para tomada de decisão?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sim. Estruturamos o ciclo completo: coleta automatizada (sensores IoT, APIs, ERPs, planilhas, web scraping), centralização em data warehouse (BigQuery, Postgres, Supabase), tratamento e modelagem (ETL/ELT em Python e dbt) e visualização em dashboards executivos (Metabase, Looker, Power BI). Aplicamos IA para detectar padrões, prever cenários e gerar alertas automáticos — transformando dado bruto em decisão acionável em tempo real." }
        },
        {
          "@type": "Question",
          "name": "Vocês substituem meu time interno de TI?",
          "acceptedAnswer": { "@type": "Answer", "text": "Não necessariamente. Atuamos de duas formas: como departamento de tecnologia completo para empresas que não possuem time interno, ou como extensão estratégica do time existente — assumindo automação, IA e infraestrutura enquanto seu time foca no core." }
        },
        {
          "@type": "Question",
          "name": "E a propriedade do código e dos dados?",
          "acceptedAnswer": { "@type": "Answer", "text": "Tudo é seu. Código-fonte, documentação, credenciais, infraestrutura e dados pertencem 100% à sua empresa. Entregamos repositórios versionados, documentação técnica e handover completo a qualquer momento, sem lock-in." }
        },
        {
          "@type": "Question",
          "name": "Como começar?",
          "acceptedAnswer": { "@type": "Answer", "text": "Agende uma conversa de diagnóstico gratuita. Em 45 minutos mapeamos seus principais gargalos, identificamos oportunidades de automação e desenhamos uma proposta sob medida. Sem compromisso, sem pressão comercial." }
        }
